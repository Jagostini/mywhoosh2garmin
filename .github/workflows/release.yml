name: Build & Release
on:
  push:
    tags:
      - 'v*'
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release (e.g. v1.2.3). Leave empty to build artifacts only.'
        required: false
        default: ''
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libgl-dev xorg-dev libxxf86vm-dev libwayland-dev libxkbcommon-dev wayland-protocols pkg-config
      - name: Build Linux
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags "-s -w" -o mywhoosh2garmin-linux-amd64 .
      - uses: actions/upload-artifact@v7
        with:
          name: mywhoosh2garmin-linux-amd64
          path: mywhoosh2garmin-linux-amd64

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libgl-dev xorg-dev libxxf86vm-dev mingw-w64
      - name: Embed Windows icon via syso
        run: |
          # Generate a .syso resource file so the exe gets the icon embedded
          cat > icon.rc << 'RC'
          IDI_ICON1 ICON "images/icon.ico"
          RC
          x86_64-w64-mingw32-windres icon.rc -O coff -o icon_windows_amd64.syso
      - name: Build Windows
        env:
          CGO_ENABLED: 1
          GOOS: windows
          GOARCH: amd64
          CC: x86_64-w64-mingw32-gcc
        run: go build -trimpath -ldflags "-s -w -H=windowsgui" -o mywhoosh2garmin-windows-amd64.exe .
      - uses: actions/upload-artifact@v7
        with:
          name: mywhoosh2garmin-windows-amd64.exe
          path: mywhoosh2garmin-windows-amd64.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build macOS arm64
        env:
          CGO_ENABLED: 1
          GOOS: darwin
          GOARCH: arm64
          CC: clang
        run: go build -trimpath -ldflags "-s -w" -o mywhoosh2garmin .
      - name: Create .app bundle and DMG
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          VERSION="${VERSION#v}"
          APP="MyWhoosh2Garmin.app"
          mkdir -p "$APP/Contents/MacOS"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            '  <key>CFBundleName</key><string>MyWhoosh2Garmin</string>' \
            '  <key>CFBundleDisplayName</key><string>MyWhoosh2Garmin</string>' \
            '  <key>CFBundleIdentifier</key><string>com.pgee70.mywhoosh2garmin</string>' \
            "  <key>CFBundleVersion</key><string>${GITHUB_RUN_NUMBER}</string>" \
            "  <key>CFBundleShortVersionString</key><string>${VERSION}</string>" \
            '  <key>CFBundleExecutable</key><string>mywhoosh2garmin</string>' \
            '  <key>CFBundleIconFile</key><string>AppIcon</string>' \
            '  <key>CFBundlePackageType</key><string>APPL</string>' \
            '  <key>LSMinimumSystemVersion</key><string>12.0</string>' \
            '</dict></plist>' \
            > "$APP/Contents/Info.plist"
          mkdir -p "$APP/Contents/Resources"
          cp images/icon.icns "$APP/Contents/Resources/AppIcon.icns"
          cp mywhoosh2garmin "$APP/Contents/MacOS/mywhoosh2garmin"
          chmod +x "$APP/Contents/MacOS/mywhoosh2garmin"
          # Ad-hoc sign the app so Gatekeeper accepts it on first launch
          codesign --force --deep --sign - "$APP"
          mkdir dmg_staging
          cp -R "$APP" dmg_staging/
          hdiutil create \
            -volname "MyWhoosh2Garmin" \
            -srcfolder dmg_staging \
            -ov -format UDZO \
            MyWhoosh2Garmin-macos-arm64.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: MyWhoosh2Garmin-macos-arm64.dmg
          path: MyWhoosh2Garmin-macos-arm64.dmg

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android NDK (preinstalled on ubuntu runners)
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -z "$ANDROID_NDK_HOME" ] || [ ! -d "$ANDROID_NDK_HOME" ]; then
            NDK="$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -1)"
            if [ -z "$NDK" ]; then
              yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.1.10909125"
              NDK="$SDK/ndk/26.1.10909125"
            fi
            echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          fi
          echo "NDK: ${ANDROID_NDK_HOME:-$NDK}"
      - name: Install Fyne CLI
        run: go install fyne.io/tools/cmd/fyne@latest
      - name: Package Android APK
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          VERSION="${VERSION#v}"
          case "$VERSION" in [0-9]*.[0-9]*.[0-9]*) ;; *) VERSION="1.0.0" ;; esac
          "$(go env GOPATH)/bin/fyne" package --target android/arm64 \
            --app-id com.pgee70.mywhoosh2garmin \
            --name MyWhoosh2Garmin \
            --icon images/icon.png \
            --app-version "$VERSION" \
            --app-build "${GITHUB_RUN_NUMBER}"
          ls -lh *.apk
          mv *.apk MyWhoosh2Garmin-android.apk
      - uses: actions/upload-artifact@v7
        with:
          name: MyWhoosh2Garmin-android.apk
          path: MyWhoosh2Garmin-android.apk

  release:
    needs: [build-linux, build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    # Run when triggered by a version tag push, or a manual dispatch with a tag provided
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/mywhoosh2garmin-linux-amd64/mywhoosh2garmin-linux-amd64
            artifacts/mywhoosh2garmin-windows-amd64.exe/mywhoosh2garmin-windows-amd64.exe
            artifacts/MyWhoosh2Garmin-macos-arm64.dmg/MyWhoosh2Garmin-macos-arm64.dmg
            artifacts/MyWhoosh2Garmin-android.apk/MyWhoosh2Garmin-android.apk
